<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>⚡ АНИМЕ-АРЕНА ⚡</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Montserrat:wght@500;700&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #05050a; color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.15) 0%, transparent 50%), radial-gradient(circle at 50% 100%, rgba(0, 243, 255, 0.1) 0%, transparent 50%); }
        .header { display: flex; justify-content: space-between; width: 100%; max-width: 900px; font-family: 'Russo One', sans-serif; font-size: 28px; margin-bottom: 20px; align-items: center; color: white; text-shadow: 0 0 15px #ff0055; }
        .wallet { background: rgba(0,0,0,0.8); border: 2px solid #ffd700; padding: 10px 20px; border-radius: 5px; color: #ffd700; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: rgba(15,15,25,0.85); color: #888; border: 2px solid #333; padding: 10px 20px; font-family: 'Russo One', sans-serif; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        .tab-btn.active { color: white; border-color: #00f3ff; box-shadow: 0 0 15px #00f3ff; }
        .screen { display: none; width: 100%; max-width: 900px; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }
        .squad-container { display: flex; gap: 15px; justify-content: center; width: 100%; margin-bottom: 20px; flex-wrap: wrap; }
        .squad-slot { flex: 1; min-width: 200px; max-width: 250px; background: rgba(15,15,25,0.85); border: 2px solid #333; border-radius: 10px; padding: 15px; text-align: center; }
        .squad-slot.empty { border-style: dashed; color: #555; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; min-height: 250px; }
        .char-img-box { width: 100px; height: 100px; margin: 0 auto 10px; border-radius: 50%; background: #000; border: 3px solid #333; overflow: hidden; }
        .char-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .char-name { font-family: 'Russo One', sans-serif; font-size: 18px; color: white; margin-bottom: 5px; }
        .char-desc { font-size: 12px; color: #888; margin-bottom: 10px; }
        .stat-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: #aaa; }
        .stat-row span:last-child { color: white; font-weight: 700; }
        .btn { background: transparent; border: 2px solid #00f3ff; color: #00f3ff; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-family: 'Russo One', sans-serif; font-size: 14px; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background: #00f3ff; color: black; box-shadow: 0 0 15px #00f3ff; }
        .btn-gold { border-color: #ffd700; color: #ffd700; }
        .btn-gold:hover { background: #ffd700; color: black; }
        #status { font-size: 16px; color: #00f3ff; margin: 15px 0; text-align: center; font-weight: 800; }
        .battle-screen { display: flex; justify-content: space-between; width: 100%; gap: 20px; margin-top: 20px; }
        .battle-side { flex: 1; background: rgba(15,15,25,0.85); border: 2px solid #333; border-radius: 10px; padding: 15px; }
        .battle-hero { display: flex; align-items: center; gap: 10px; background: #000; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #222; }
        .battle-hero .char-img-box { width: 40px; height: 40px; margin: 0; }
        .hp-bar-container { flex-grow: 1; height: 8px; background: #222; border-radius: 5px; overflow: hidden; }
        .hp-bar { height: 100%; background: #00f3ff; transition: width 0.3s; }
        .hp-bar.enemy { background: #ff0055; }
        .battle-log { width: 100%; height: 100px; background: rgba(0,0,0,0.9); border: 1px solid #333; border-radius: 5px; margin-top: 15px; padding: 10px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #00f3ff; }
        .battle-controls { display: flex; gap: 10px; margin-top: 15px; width: 100%; }
    </style>
</head>
<body>

    <div class="header">
        <div>⚡ АНИМЕ-АРЕНА</div>
        <div class="wallet">Монеты: <span id="coins">1000</span></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('base', this)">Отряд</button>
        <button class="tab-btn" onclick="switchTab('shop', this)">Магазин</button>
        <button class="tab-btn" onclick="switchTab('map', this)">Арена</button>
    </div>

    <div id="status">Соберите отряд!</div>

    <div id="screen-base" class="screen active">
        <div class="squad-container" id="squad-container"></div>
    </div>

    <div id="screen-shop" class="screen">
        <div style="background: rgba(15,15,25,0.85); border: 2px solid #ffd700; padding: 20px; border-radius: 10px; text-align: center;">
            <h3 style="color: #ffd700; font-family: 'Russo One';">Покупка монет</h3>
            <button class="btn btn-gold" onclick="buyCoins()">Купить 500 монет</button>
        </div>
    </div>

    <div id="screen-map" class="screen">
        <button class="btn" style="max-width: 300px;" onclick="startBattle()">Начать бой (Ставка 100)</button>
    </div>

    <div id="screen-battle" class="screen">
        <div class="battle-screen">
            <div class="battle-side player"><h3 style="text-align:center; color: #00f3ff;">ТВОЙ ОТРЯД</h3><div id="player-team"></div></div>
            <div class="battle-side enemy"><h3 style="text-align:center; color: #ff0055;">ВРАГ</h3><div id="enemy-team"></div></div>
        </div>
        <div class="battle-log" id="battle-log"></div>
        <div class="battle-controls"><button class="btn" onclick="nextTurn()">УДАРИТЬ</button></div>
    </div>

    <script>
        // Аниме персонажи с картинками от DiceBear (они точно загрузятся)
        const allHeroes = [
            { id: 1, name: "Наруто", img: "https://api.dicebear.com/7.x/adventurer/svg?seed=Naruto&backgroundColor=ff8f00", desc: "Хокаге. Использует Расенган.", base: { str: 80, spd: 90, int: 50, hp: 120 }, level: 1 },
            { id: 2, name: "Гоку", img: "https://api.dicebear.com/7.x/adventurer/svg?seed=Goku&backgroundColor=00f3ff", desc: "Супер Сайян. Бьет ки-волнами.", base: { str: 100, spd: 85, int: 40, hp: 150 }, level: 1 },
            { id: 3, name: "Луффи", img: "https://api.dicebear.com/7.x/adventurer/svg?seed=Luffy&backgroundColor=ff0055", desc: "Король пиратов. Резиновый человек.", base: { str: 90, spd: 70, int: 60, hp: 140 }, level: 1 },
            { id: 4, name: "Леви", img: "https://api.dicebear.com/7.x/adventurer/svg?seed=Levi&backgroundColor=333", desc: "Сильнейший солдат человечества.", base: { str: 85, spd: 100, int: 80, hp: 100 }, level: 1 },
            { id: 5, name: "Саске", img: "https://api.dicebear.com/7.x/adventurer/svg?seed=Sasuke&backgroundColor=444", desc: "Последний Учиха. Владеет Шаринганом.", base: { str: 75, spd: 85, int: 90, hp: 110 }, level: 1 }
        ];

        let coins = 1000;
        let squad = [null, null, null];
        let pTeam = [], eTeam = [];

        function switchTab(tabId, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        function renderSquad() {
            const container = document.getElementById('squad-container');
            container.innerHTML = '';
            squad.forEach((hero, index) => {
                if (hero === null) {
                    container.innerHTML += `<div class="squad-slot empty" onclick="addRandomHero()"><div style="font-size: 40px;">+</div><div>Добавить</div></div>`;
                } else {
                    container.innerHTML += `
                        <div class="squad-slot">
                            <div class="char-img-box"><img src="${hero.img}"></div>
                            <div class="char-name">${hero.name}</div>
                            <div class="char-desc">${hero.desc}</div>
                            <div class="stat-row"><span>СИЛА:</span> <span>${hero.base.str}</span></div>
                            <div class="stat-row"><span>HP:</span> <span>${hero.base.hp}</span></div>
                        </div>`;
                }
            });
        }

        function addRandomHero() {
            const emptyIndex = squad.indexOf(null);
            if (emptyIndex === -1) return;
            const randomHero = allHeroes[Math.floor(Math.random() * allHeroes.length)];
            // Проверяем, нет ли уже такого героя
            if (!squad.find(h => h && h.id === randomHero.id)) {
                squad[emptyIndex] = { ...randomHero };
                renderSquad();
            } else {
                addRandomHero(); // Если есть, берем другого
            }
        }

        async function buyCoins() {
            // Делаем запрос к нашему серверу (имитация)
            const res = await fetch('/api/create-payment', { method: 'POST' });
            const data = await res.json();
            if (data.url) {
                window.location.href = data.url; // Переходим по ссылке (которой нет, но сервер вернет нас с success=true)
            }
        }

        // Проверка на успешную оплату при загрузке
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                coins += 500;
                document.getElementById('coins').innerText = coins;
                document.getElementById('status').innerText = "Оплата прошла успешно! +500 монет.";
                window.history.replaceState({}, document.title, "/"); // Очищаем ссылку
            }
            renderSquad();
        };

        function startBattle() {
            if (!squad[0] || !squad[1] || !squad[2]) { alert("Нужно 3 героя!"); return; }
            if (coins < 100) { alert("Нужно 100 монет!"); return; }
            
            coins -= 100;
            document.getElementById('coins').innerText = coins;
            
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-battle').classList.add('active');

            pTeam = squad.map(h => ({ ...h, currentHp: h.base.hp, maxHp: h.base.hp, dmg: h.base.str }));
            
            eTeam = [];
            for(let i=0; i<3; i++) {
                let enemy = allHeroes[Math.floor(Math.random() * allHeroes.length)];
                eTeam.push({ ...enemy, currentHp: enemy.base.hp + 50, maxHp: enemy.base.hp + 50, dmg: enemy.base.str });
            }

            renderBattleUI();
            document.getElementById('battle-log').innerHTML = "Бой начался! Нажмите 'Ударить'.";
        }

        function renderBattleUI() {
            document.getElementById('player-team').innerHTML = pTeam.map(h => `<div class="battle-hero"><div class="char-img-box"><img src="${h.img}"></div><div style="flex-grow:1"><div style="font-size:12px; color:#fff">${h.name}</div><div class="hp-bar-container"><div class="hp-bar" style="width:${(h.currentHp/h.maxHp)*100}%"></div></div></div></div>`).join('');
            document.getElementById('enemy-team').innerHTML = eTeam.map(h => `<div class="battle-hero"><div class="char-img-box"><img src="${h.img}"></div><div style="flex-grow:1"><div style="font-size:12px; color:#fff">${h.name}</div><div class="hp-bar-container"><div class="hp-bar enemy" style="width:${(h.currentHp/h.maxHp)*100}%"></div></div></div></div>`).join('');
        }

        function nextTurn() {
            const log = document.getElementById('battle-log');
            let targetE = eTeam.find(h => h.currentHp > 0);
            let attackerP = pTeam.find(h => h.currentHp > 0);

            if (targetE && attackerP) {
                targetE.currentHp -= attackerP.dmg;
                if (targetE.currentHp < 0) targetE.currentHp = 0;
                log.innerHTML += `<br>${attackerP.name} наносит ${attackerP.dmg} урона по ${targetE.name}!`;
            }

            setTimeout(() => {
                let targetP = pTeam.find(h => h.currentHp > 0);
                let attackerE = eTeam.find(h => h.currentHp > 0);
                if (targetP && attackerE) {
                    targetP.currentHp -= attackerE.dmg;
                    if (targetP.currentHp < 0) targetP.currentHp = 0;
                    log.innerHTML += `<br><span style="color:#ff5555">${attackerE.name} наносит ${attackerE.dmg} урона по ${targetP.name}!</span>`;
                }
                renderBattleUI();
                log.scrollTop = log.scrollHeight;

                if (!eTeam.find(h => h.currentHp > 0)) {
                    log.innerHTML += `<br><span style="color:gold">ПОБЕДА! Вы получаете 200 монет.</span>`;
                    coins += 200;
                    document.getElementById('coins').innerText = coins;
                    setTimeout(() => switchTab('base', document.querySelectorAll('.tab-btn')[0]), 2000);
                } else if (!pTeam.find(h => h.currentHp > 0)) {
                    log.innerHTML += `<br><span style="color:red">ПОРАЖЕНИЕ.</span>`;
                    setTimeout(() => switchTab('base', document.querySelectorAll('.tab-btn')[0]), 2000);
                }
            }, 500);
        }
    </script>
</body>
</html>
