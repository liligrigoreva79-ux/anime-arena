<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AnimeFight</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { 
            --bg: #0b0914; 
            --panel: #151221; 
            --border: #2a2142;
            --text: #ffffff;
            --text-dim: #9a94b5;
            --purple: #8a2be2; 
            --purple-light: #b04aff;
            --gold: #ffb800;
        }

        * { box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg); 
            color: var(--text); min-height: 100vh;
        }

        /* Верхнее меню */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; border-bottom: 2px solid var(--border); background: #0f0c17;
        }
        .logo { font-size: 24px; font-weight: 900; color: var(--text); display: flex; align-items: center; gap: 10px;}
        .logo span { color: var(--purple-light); }
        .nav { display: flex; gap: 25px; font-size: 14px; font-weight: 700; color: var(--text-dim); }
        .nav a { color: inherit; text-decoration: none; transition: 0.3s; }
        .nav a:hover, .nav a.active { color: var(--text); }
        
        .header-right { display: flex; gap: 15px; align-items: center; }
        .search { background: #1a1629; border: 1px solid var(--border); border-radius: 8px; padding: 8px 15px; color: white; font-family: inherit; outline: none; }
        .btn-auth { background: var(--purple); color: white; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-auth:hover { background: var(--purple-light); }

        /* Главный баннер */
        .banner {
            width: 100%; height: 400px; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop'); /* Фон баннера */
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; border-bottom: 2px solid var(--purple);
        }
        .banner h1 { font-size: 56px; font-weight: 900; margin: 0; line-height: 1.1; text-shadow: 0 5px 20px rgba(0,0,0,0.8); }
        .banner h1 span { color: var(--purple-light); }
        .banner p { font-size: 18px; color: #ddd; margin: 15px 0 30px; font-weight: 500; }
        .btn-main { background: var(--purple); color: white; border: none; padding: 15px 40px; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(138, 43, 226, 0.5); }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 0 30px rgba(138, 43, 226, 0.8); }

        /* Контент */
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 40px; display: flex; gap: 30px; }
        .main-content { flex: 1; }
        
        .section-title { font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .section-title::before { content: ''; display: block; width: 6px; height: 24px; background: var(--purple-light); border-radius: 3px; }

        /* Сетка карточек */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        
        .card {
            background: var(--panel); border: 1px solid var(--border); border-radius: 15px; overflow: hidden;
            transition: 0.3s; cursor: pointer; position: relative;
        }
        .card:hover { border-color: var(--purple-light); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(138, 43, 226, 0.2); }
        
        .card-img-box { height: 180px; width: 100%; position: relative; }
        .card-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .vs-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; font-weight: 900; color: white; font-style: italic; text-shadow: 0 0 10px var(--purple), 0 0 20px var(--purple); }
        
        .card-info { padding: 15px; text-align: center; }
        .card-title { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
        .btn-small { background: var(--purple); color: white; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: 0.3s; }
        .btn-small:hover { background: var(--purple-light); }

        /* Боковая панель */
        .sidebar { width: 350px; flex-shrink: 0; }
        .sidebar-box { background: var(--panel); border: 1px solid var(--border); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .sidebar-title { font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        
        .api-item { background: #0f0c17; border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 10px; }
        .api-item h4 { margin: 0 0 10px 0; font-size: 14px; color: var(--gold); }
        .api-code { font-family: monospace; font-size: 11px; color: var(--text-dim); background: #000; padding: 5px 10px; border-radius: 5px; }

        /* Аниме карточки */
        .anime-card { position: relative; height: 200px; border-radius: 15px; overflow: hidden; cursor: pointer; }
        .anime-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .anime-card:hover img { transform: scale(1.1); }
        .anime-title { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; background: linear-gradient(to top, #000, transparent); font-weight: 800; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚔️ Anime<span>Fight</span></div>
        <div class="nav">
            <a href="#">Главная</a>
            <a href="#" class="active">Бои</a>
            <a href="#">Магазин</a>
            <a href="#">Рейтинг</a>
            <a href="#">Новости</a>
        </div>
        <div class="header-right">
            <input type="text" class="search" placeholder="Поиск...">
            <button class="btn-auth">Войти</button>
        </div>
    </header>

    <div class="banner">
        <h1>Аниме бои<br><span>онлайн</span></h1>
        <p>Сражайся, побеждай, поднимайся в рейтинге!</p>
        <button class="btn-main" onclick="startBattle()">Начать бой →</button>
    </div>

    <div class="container">
        <div class="main-content">
            <div class="section-title">Популярные бои</div>
            <div class="cards-grid" id="heroes-grid">
                <!-- Сюда будут подставляться карточки из скрипта -->
            </div>

            <div class="section-title">Популярные аниме</div>
            <div class="cards-grid" id="anime-grid">
                <!-- Сюда подставим аниме-карточки -->
            </div>
        </div>

        <!-- Боковая панель (Для препода) -->
        <div class="sidebar">
            <div class="sidebar-box">
                <div class="sidebar-title">👨‍💻 API команды</div>
                <div class="api-item">
                    <h4>👑 Система турниров</h4>
                    <div class="api-code">GET /api/check-payment</div>
                </div>
                <div class="api-item">
                    <h4>🎮 Система команд</h4>
                    <div class="api-code">POST /api/create-payment</div>
                </div>
                <div class="api-item" style="border-color: var(--purple);">
                    <h4 style="color: var(--purple-light);">⚔️ Проведение боя</h4>
                    <div id="battle-log" style="font-size: 12px; color: #ccc; height: 100px; overflow-y: auto; background: #000; padding: 10px; border-radius: 5px; margin-top: 5px;">
                        Ожидание боя...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
                // --- БАЗА ГЕРОЕВ ---
        const allHeroes = [
            { id: 1, name: "Наруто", uni: "Naruto", img: "https://cdn.myanimelist.net/images/characters/6/25399.jpg", base: { str: 85, hp: 130 } },
            { id: 2, name: "Саске", uni: "Naruto", img: "https://cdn.myanimelist.net/images/characters/9/140833.jpg", base: { str: 88, hp: 120 } },
            { id: 3, name: "Гоку", uni: "Dragon Ball", img: "https://cdn.myanimelist.net/images/characters/6/26359.jpg", base: { str: 100, hp: 150 } },
            { id: 4, name: "Луффи", uni: "One Piece", img: "https://cdn.myanimelist.net/images/characters/9/310307.jpg", base: { str: 90, hp: 140 } },
            { id: 5, name: "Зоро", uni: "One Piece", img: "https://cdn.myanimelist.net/images/characters/5/317051.jpg", base: { str: 92, hp: 135 } },
            { id: 6, name: "Леви", uni: "Attack on Titan", img: "https://cdn.myanimelist.net/images/characters/2/241413.jpg", base: { str: 95, hp: 110 } },
            { id: 7, name: "Эрен", uni: "Attack on Titan", img: "https://cdn.myanimelist.net/images/characters/10/216895.jpg", base: { str: 80, hp: 160 } },
            { id: 8, name: "Ичиго", uni: "Bleach", img: "https://cdn.myanimelist.net/images/characters/3/11877.jpg", base: { str: 88, hp: 140 } }
        ];

        // --- КАРТИНКИ АНИМЕ (Для нижнего блока) ---
        const animes = [
            { name: "Naruto", img: "https://cdn.myanimelist.net/images/anime/13/17405.jpg" },
            { name: "One Piece", img: "https://cdn.myanimelist.net/images/anime/6/73245.jpg" },
            { name: "Dragon Ball Z", img: "https://cdn.myanimelist.net/images/anime/6/20936.jpg" },
            { name: "Attack on Titan", img: "https://cdn.myanimelist.net/images/anime/10/47347.jpg" },
            { name: "Bleach", img: "https://cdn.myanimelist.net/images/anime/3/40451.jpg" }
        ];

        // --- ОТРИСОВКА КАРТОЧЕК БОЕВ ---
        function renderPopularFights() {
            const grid = document.getElementById('heroes-grid');
            grid.innerHTML = '';
            
            // Берем первые 3 пары для отображения
            for (let i = 0; i < 3; i++) {
                const h1 = allHeroes[i * 2];
                const h2 = allHeroes[i * 2 + 1];
                
                grid.innerHTML += `
                    <div class="card" onclick="quickFight(${h1.id}, ${h2.id})">
                        <div class="card-img-box">
                            <img src="${h1.img}" style="width: 50%; float: left; border-right: 2px solid var(--purple);">
                            <img src="${h2.img}" style="width: 50%; float: right;">
                            <div class="vs-text">VS</div>
                        </div>
                        <div class="card-info">
                            <div class="card-title">${h1.name} vs ${h2.name}</div>
                            <button class="btn-small">▶ Смотреть</button>
                        </div>
                    </div>
                `;
            }
        }

        // --- ОТРИСОВКА АНИМЕ (Нижний блок) ---
        function renderAnimes() {
            const grid = document.getElementById('anime-grid');
            grid.innerHTML = '';
            animes.forEach(anime => {
                grid.innerHTML += `
                    <div class="anime-card">
                        <img src="${anime.img}">
                        <div class="anime-title">${anime.name}</div>
                    </div>
                `;
            });
        }

        // --- БЫСТРЫЙ БОЙ ПО КЛИКУ НА КАРТОЧКУ ---
        function quickFight(id1, id2) {
            const h1 = allHeroes.find(h => h.id === id1);
            const h2 = allHeroes.find(h => h.id === id2);
            
            const log = document.getElementById('battle-log');
            log.innerHTML = `<span style="color:var(--purple-light)">Бой: ${h1.name} vs ${h2.name}</span><br>`;
            
            let hp1 = h1.base.hp;
            let hp2 = h2.base.hp;
            let turn = 1;

            const interval = setInterval(() => {
                if (hp1 <= 0 || hp2 <= 0) {
                    clearInterval(interval);
                    const winner = hp1 > 0 ? h1.name : h2.name;
                    log.innerHTML += `<br><span style="color:var(--gold); font-weight:bold;">🏆 Победил ${winner}!</span>`;
                    log.scrollTop = log.scrollHeight;
                    return;
                }

                if (turn % 2 !== 0) {
                    hp2 -= h1.base.str;
                    log.innerHTML += `<br>⚔️ ${h1.name} бьет на ${h1.base.str} (У ${h2.name} осталось ${Math.max(0, hp2)} HP)`;
                } else {
                    hp1 -= h2.base.str;
                    log.innerHTML += `<br>💥 ${h2.name} бьет на ${h2.base.str} (У ${h1.name} осталось ${Math.max(0, hp1)} HP)`;
                }
                turn++;
                log.scrollTop = log.scrollHeight;
            }, 800);
        }

        // --- ОСНОВНАЯ КНОПКА "НАЧАТЬ БОЙ" ---
        function startBattle() {
            const log = document.getElementById('battle-log');
            log.innerHTML = `<span style="color:var(--purple-light)">Поиск случайного соперника...</span><br>`;
            
            setTimeout(() => {
                const shuffled = [...allHeroes].sort(() => 0.5 - Math.random());
                const p1 = shuffled[0];
                const p2 = shuffled[1];
                quickFight(p1.id, p2.id);
            }, 1000);
        }

        // Запускаем отрисовку при загрузке страницы
        window.onload = () => {
            renderPopularFights();
            renderAnimes();
        };
