<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Anime Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0c29;
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --panel: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #fff;
            --text-dim: #a0a0b0;
            --accent: #ff2a6d;
            --blue: #05d9e8;
            --gold: #ffd700;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; padding: 0; 
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text); min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .header { display: flex; justify-content: space-between; width: 100%; max-width: 1100px; font-family: 'Russo One', sans-serif; font-size: 26px; margin: 20px 0; align-items: center; padding: 0 20px; box-sizing: border-box; }
        .logo { text-shadow: 0 0 15px var(--accent); }
        .logo span { color: var(--accent); }
        .wallet { background: rgba(0, 0, 0, 0.5); border: 2px solid var(--gold); padding: 8px 20px; border-radius: 8px; font-size: 18px; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        .wallet span { color: var(--gold); }

        .tabs { display: flex; gap: 10px; margin-bottom: 30px; width: 100%; max-width: 1100px; padding: 0 20px; box-sizing: border-box; }
        .tab-btn { background: rgba(0,0,0,0.4); color: var(--text-dim); border: 1px solid var(--border); padding: 12px 30px; font-family: 'Russo One', sans-serif; font-size: 16px; cursor: pointer; transition: 0.3s; border-radius: 8px; text-transform: uppercase; }
        .tab-btn.active { background: var(--panel); color: white; border-color: var(--accent); box-shadow: 0 0 15px rgba(255, 42, 109, 0.3); }

        .screen { display: none; width: 100%; max-width: 1100px; padding: 0 20px; box-sizing: border-box; }
        .screen.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; width: 100%; margin-bottom: 30px;}
        
        .hero-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: 0.3s; overflow: hidden; position: relative; backdrop-filter: blur(10px); }
        .hero-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(255, 42, 109, 0.3); }
        .hero-card.selected { border: 2px solid var(--blue); box-shadow: 0 0 20px var(--blue); }
        
        .hero-img-box { width: 100%; height: 250px; background: #000; position: relative; overflow: hidden; }
        .hero-img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .hero-card:hover .hero-img-box img { transform: scale(1.1); }
        .hero-img-box::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to top, rgba(15, 12, 41, 1), transparent); }

        .hero-info { padding: 15px; position: relative; z-index: 2; margin-top: -30px; }
        .hero-name { font-family: 'Russo One', sans-serif; font-size: 20px; color: white; margin-bottom: 2px; }
        .hero-universe { font-size: 11px; color: var(--blue); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: bold;}
        .hero-desc { font-size: 11px; color: #ccc; margin-bottom: 10px; line-height: 1.4; }
        
        .stat-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 3px; }
        .stat-row span:last-child { color: white; font-weight: 800; }

        .btn { background: var(--accent); border: none; color: white; padding: 15px 40px; border-radius: 8px; cursor: pointer; font-family: 'Russo One', sans-serif; font-size: 16px; transition: 0.3s; text-transform: uppercase; box-shadow: 0 5px 15px rgba(255, 42, 109, 0.4); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 42, 109, 0.6); }
        .btn-outline { background: transparent; border: 2px solid var(--blue); color: var(--blue); box-shadow: none; }
        .btn-outline:hover { background: rgba(5, 217, 232, 0.1); box-shadow: 0 0 15px rgba(5, 217, 232, 0.4); }

        .battle-log { background: rgba(0,0,0,0.8); border: 1px solid var(--border); border-radius: 8px; padding: 15px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 13px; color: var(--blue); margin-bottom: 20px; }
        .hp-bar-bg { width: 100%; height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .hp-bar { height: 100%; background: var(--blue); transition: width 0.3s; }
        .hp-bar.enemy { background: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">ANIME <span>ARENA</span></div>
        <div class="wallet">Баланс: <span id="coins">1000</span></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('roster', this)">Выбор Бойцов</button>
        <button class="tab-btn" onclick="switchTab('arena', this)">На Арену</button>
        <button class="tab-btn" onclick="switchTab('shop', this)">Магазин</button>
    </div>

    <div id="screen-roster" class="screen active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="font-family: 'Russo One'; margin: 0;">Выберите отряд</h2>
            <div style="color: var(--text-dim); font-size: 14px; font-weight: bold;">Выбрано: <span id="squad-count" style="color: white;">0 / 3</span></div>
        </div>
        <div class="grid" id="roster-grid"></div>
    </div>

    <div id="screen-arena" class="screen">
        <div style="background: var(--panel); border: 1px solid var(--border); padding: 30px; border-radius: 12px; text-align: center; backdrop-filter: blur(10px);">
            <h2 style="font-family: 'Russo One'; margin-top: 0;">Арена ждет</h2>
            <p style="color: var(--text-dim); margin-bottom: 20px;">Вход: 100 монет. Победитель забирает 300 монет.</p>
            <button class="btn" onclick="startBattle()">В БОЙ</button>
        </div>
        <div id="battle-screen" style="display: none; margin-top: 30px;">
            <div class="battle-log" id="battle-log"></div>
            <div id="battle-teams" style="display: flex; gap: 20px;"></div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-outline" onclick="closeBattle()">Завершить</button>
            </div>
        </div>
    </div>

    <div id="screen-shop" class="screen">
        <div style="background: var(--panel); border: 1px solid var(--border); padding: 30px; border-radius: 12px; text-align: center; backdrop-filter: blur(10px);">
            <h2 style="font-family: 'Russo One'; margin-top: 0; color: var(--gold);">Пополнение</h2>
            <button class="btn" style="background: var(--gold); color: black; box-shadow: 0 5px 15px rgba(255,215,0,0.4);" onclick="buyCoins()">Купить 500 монет</button>
        </div>
    </div>

    <script>
        // ИСПОЛЬЗУЕМ КАРТИНКИ С MYANIMELIST (ОНИ НЕ БЛОКИРУЮТСЯ)
        const allHeroes = [
            { id: 1, name: "Гоку", uni: "Dragon Ball", img: "https://cdn.myanimelist.net/images/characters/6/26359.jpg", desc: "Супер Сайян. Бьет ки-волнами.", base: { str: 100, hp: 150 } },
            { id: 2, name: "Наруто", uni: "Naruto", img: "https://cdn.myanimelist.net/images/characters/6/25399.jpg", desc: "Седьмой Хокаге. Владеет Расенганом.", base: { str: 85, hp: 130 } },
            { id: 3, name: "Луффи", uni: "One Piece", img: "https://cdn.myanimelist.net/images/characters/9/310307.jpg", desc: "Король пиратов. Резиновый человек.", base: { str: 90, hp: 140 } },
            { id: 4, name: "Леви", uni: "Attack on Titan", img: "https://cdn.myanimelist.net/images/characters/2/241413.jpg", desc: "Сильнейший солдат человечества.", base: { str: 95, hp: 110 } },
            { id: 5, name: "Саске", uni: "Naruto", img: "https://cdn.myanimelist.net/images/characters/9/140833.jpg", desc: "Последний Учиха. Владеет Шаринганом.", base: { str: 88, hp: 120 } },
            { id: 6, name: "Эрен", uni: "Attack on Titan", img: "https://cdn.myanimelist.net/images/characters/10/216895.jpg", desc: "Носитель Титана. Идет к свободе.", base: { str: 80, hp: 160 } },
            { id: 7, name: "Зоро", uni: "One Piece", img: "https://cdn.myanimelist.net/images/characters/5/317051.jpg", desc: "Мечник. Стиль трех мечей.", base: { str: 92, hp: 135 } },
            { id: 8, name: "Ичиго", uni: "Bleach", img: "https://cdn.myanimelist.net/images/characters/3/11877.jpg", desc: "Синигами. Заменяет души.", base: { str: 88, hp: 140 } }
        ];

        let coins = 1000;
        let squad = [];
        let battleInterval = null;

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            if (btnElement) btnElement.classList.add('active');
            if (tabId === 'arena') document.getElementById('battle-screen').style.display = 'none';
        }

        function renderRoster() {
            const container = document.getElementById('roster-grid');
            container.innerHTML = '';
            allHeroes.forEach(hero => {
                const isSelected = squad.find(h => h.id === hero.id);
                container.innerHTML += `
                    <div class="hero-card ${isSelected ? 'selected' : ''}" onclick="toggleSquad(${hero.id})">
                        <div class="hero-img-box"><img src="${hero.img}"></div>
                        <div class="hero-info">
                            <div class="hero-name">${hero.name}</div>
                            <div class="hero-universe">${hero.uni}</div>
                            <div class="hero-desc">${hero.desc}</div>
                            <div class="stat-row"><span>СИЛА:</span> <span>${hero.base.str}</span></div>
                            <div class="stat-row"><span>HP:</span> <span>${hero.base.hp}</span></div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleSquad(heroId) {
            const index = squad.findIndex(h => h.id === heroId);
            if (index !== -1) {
                squad.splice(index, 1);
            } else {
                if (squad.length >= 3) { alert("В отряд можно взять только 3-х бойцов!"); return; }
                squad.push(allHeroes.find(h => h.id === heroId));
            }
            document.getElementById('squad-count').innerText = `${squad.length} / 3`;
            renderRoster();
        }

        async function buyCoins() {
            try {
                const res = await fetch('/api/create-payment', { method: 'POST' });
                const data = await res.json();
                if (data.url) window.location.href = data.url;
            } catch (e) {
                coins += 500;
                document.getElementById('coins').innerText = coins;
                alert("Тестовая оплата! Начислено 500 монет.");
            }
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                coins += 500;
                document.getElementById('coins').innerText = coins;
                window.history.replaceState({}, document.title, "/");
            }
            renderRoster();
        };

        function startBattle() {
            if (squad.length !== 3) { alert("Соберите отряд из 3-х бойцов!"); return; }
            if (coins < 100) { alert("Недостаточно монет!"); return; }
            
            coins -= 100;
            document.getElementById('coins').innerText = coins;
            
            document.getElementById('battle-screen').style.display = 'block';
            const log = document.getElementById('battle-log');
            log.innerHTML = "Бой начался...";
            
            const pTeam = squad.map(h => ({ ...h, currentHp: h.base.hp, maxHp: h.base.hp, dmg: h.base.str }));
            const eTeam = [];
            for(let i=0; i<3; i++) {
                let enemy = allHeroes[Math.floor(Math.random() * allHeroes.length)];
                eTeam.push({ ...enemy, name: "Враг: " + enemy.name, currentHp: enemy.base.hp + 30, maxHp: enemy.base.hp + 30, dmg: enemy.base.str });
            }

            renderBattleTeams(pTeam, eTeam);

            battleInterval = setInterval(() => {
                const log = document.getElementById('battle-log');
                let targetE = eTeam.find(h => h.currentHp > 0);
                let attackerP = pTeam.find(h => h.currentHp > 0);
                
                if (targetE && attackerP) {
                    targetE.currentHp -= attackerP.dmg;
                    if (targetE.currentHp < 0) targetE.currentHp = 0;
                    log.innerHTML += `<br>${attackerP.name} наносит ${attackerP.dmg} урона!`;
                }

                setTimeout(() => {
                    let targetP = pTeam.find(h => h.currentHp > 0);
                    let attackerE = eTeam.find(h => h.currentHp > 0);
                    if (targetP && attackerE) {
                        targetP.currentHp -= attackerE.dmg;
                        if (targetP.currentHp < 0) targetP.currentHp = 0;
                        log.innerHTML += `<br><span style="color:#ff2a6d">${attackerE.name} наносит ${attackerE.dmg} урона!</span>`;
                    }
                    
                    renderBattleTeams(pTeam, eTeam);
                    log.scrollTop = log.scrollHeight;

                    if (!eTeam.find(h => h.currentHp > 0)) {
                        clearInterval(battleInterval);
                        log.innerHTML += `<br><br><span style="color:gold; font-weight:bold">ПОБЕДА! Вы получаете 300 монет.</span>`;
                        coins += 300;
                        document.getElementById('coins').innerText = coins;
                    } else if (!pTeam.find(h => h.currentHp > 0)) {
                        clearInterval(battleInterval);
                        log.innerHTML += `<br><br><span style="color:red; font-weight:bold">ПОРАЖЕНИЕ.</span>`;
                    }
                }, 500);
            }, 1500);
        }

        function renderBattleTeams(pTeam, eTeam) {
            const container = document.getElementById('battle-teams');
            container.innerHTML = `
                <div style="flex: 1; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px;">
                    <h3 style="color: var(--blue); margin-top: 0; text-align: center;">ВАШ ОТРЯД</h3>
                    ${pTeam.map(h => `
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                            <img src="${h.img}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                            <div style="flex: 1;">
                                <div style="font-size: 12px; color: #fff;">${h.name}</div>
                                <div class="hp-bar-bg"><div class="hp-bar" style="width: ${(h.currentHp/h.maxHp)*100}%"></div></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div style="flex: 1; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px;">
                    <h3 style="color: var(--accent); margin-top: 0; text-align: center;">ВРАГ</h3>
                    ${eTeam.map(h => `
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                            <img src="${h.img}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                            <div style="flex: 1;">
                                <div style="font-size: 12px; color: #fff;">${h.name}</div>
                                <div class="hp-bar-bg"><div class="hp-bar enemy" style="width: ${(h.currentHp/h.maxHp)*100}%"></div></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function closeBattle() {
            clearInterval(battleInterval);
            document.getElementById('battle-screen').style.display = 'none';
        }
    </script>
</body>
</html>
